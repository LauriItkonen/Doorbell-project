services:
  cloud-service:
    build:
      context: .
      dockerfile: Dockerfile.cloud
    ports:
      - "8000:8000"
    volumes:
      - cloud-data:/data
    environment:
      - DATABASE_PATH=/data/access_control.db
      # Using default 32-byte hex fallback keys from the code
      - DOORBELL_CLOUD_KEY=0202020202020202020202020202020202020202020202020202020202020202
      - DOORBELL_HOST=0.0.0.0

  edge-gateway:
    build:
      context: .
      dockerfile: Dockerfile.edge
    ports:
      - "5000:5000"
    environment:
      - CLOUD_BASE_URL=http://cloud-service:8000
      - DOORBELL_EDGE_KEY=0101010101010101010101010101010101010101010101010101010101010101
      - DOORBELL_CLOUD_KEY=0202020202020202020202020202020202020202020202020202020202020202
      - DOORBELL_HOST=0.0.0.0
    depends_on:
      - cloud-service

volumes:
  cloud-data: