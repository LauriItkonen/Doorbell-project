services:
  cloud-service:
    build:
      context: .
      dockerfile: Dockerfile.cloud
    ports:
      - "8000:8000"
    volumes:
      - cloud-data:/data
    environment:
      - DATABASE_PATH=/data/access_control.db
      # Using default 32-byte hex fallback keys from the code
      - DOORBELL_CLOUD_KEY=0202020202020202020202020202020202020202020202020202020202020202

  edge-gateway:
    build:
      context: .
      dockerfile: Dockerfile.edge
    ports:
      - "5000:5000"
    environment:
      - CLOUD_VERIFY_URL=http://cloud-service:8000/api/cloud/verify-visitor
      - DOORBELL_EDGE_KEY=0101010101010101010101010101010101010101010101010101010101010101
      - DOORBELL_CLOUD_KEY=0202020202020202020202020202020202020202020202020202020202020202
    depends_on:
      - cloud-service

  doorbell-device:
    build:
      context: .
      dockerfile: Dockerfile.device
    container_name: micropython_doorbell
    # Required to keep STDIN open for the interactive input() prompts
    stdin_open: true
    tty: true
    environment:
      - DOORBELL_EDGE_KEY=0101010101010101010101010101010101010101010101010101010101010101
    # Resolves 'localhost' to the host machine if the gateway runs outside Docker
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  cloud-data: